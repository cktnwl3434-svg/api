<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미세먼지 / 대기질 현황</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: #f0f4f8;
      color: #222;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1D9E75, #0F6E56);
      color: white;
      padding: 2rem 1.5rem 1.5rem;
      text-align: center;
    }
    header h1 { font-size: 1.6rem; font-weight: 600; margin-bottom: 0.4rem; }
    header p { font-size: 0.85rem; opacity: 0.85; }
    .container { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem; }

    .search-box {
      display: flex; gap: 8px; margin-bottom: 1.5rem;
    }
    select, button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1.5px solid #ccc;
      font-size: 0.95rem;
      cursor: pointer;
    }
    select { flex: 1; background: white; }
    button {
      background: #1D9E75; color: white; border-color: #1D9E75;
      font-weight: 600; white-space: nowrap;
    }
    button:hover { background: #0F6E56; }
    button:disabled { background: #aaa; border-color: #aaa; cursor: not-allowed; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 1.5rem;
    }
    @media (min-width: 480px) { .summary-grid { grid-template-columns: repeat(4, 1fr); } }

    .metric-card {
      background: white;
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .metric-label { font-size: 0.75rem; color: #666; margin-bottom: 6px; }
    .metric-value { font-size: 1.7rem; font-weight: 700; color: #1D9E75; }
    .metric-unit { font-size: 0.7rem; color: #888; }
    .metric-grade {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
    }
    .grade-1 { background: #EAF3DE; color: #3B6D11; }
    .grade-2 { background: #E6F1FB; color: #185FA5; }
    .grade-3 { background: #FAEEDA; color: #854F0B; }
    .grade-4 { background: #FCEBEB; color: #A32D2D; }

    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #444;
      margin-bottom: 0.75rem;
    }
    .station-list { display: flex; flex-direction: column; gap: 10px; }
    .station-card {
      background: white;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .station-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .station-name { font-weight: 600; font-size: 0.95rem; }
    .pollutant-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
      text-align: center;
    }
    .pollutant-name { font-size: 0.7rem; color: #888; margin-bottom: 3px; }
    .pollutant-val { font-size: 1rem; font-weight: 600; color: #333; }

    .loading, .error, .empty {
      text-align: center; padding: 3rem 1rem;
      font-size: 0.95rem; color: #888;
    }
    .error { color: #A32D2D; background: #FCEBEB; border-radius: 10px; padding: 1rem; }

    .info-box {
      background: #E6F1FB; border-radius: 10px; padding: 1rem;
      font-size: 0.82rem; color: #185FA5; margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .legend {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 1rem; font-size: 0.78rem;
    }
    .legend span {
      padding: 3px 10px; border-radius: 20px; font-weight: 600;
    }
    footer {
      text-align: center; font-size: 0.78rem; color: #aaa;
      padding: 2rem 1rem;
    }
  </style>
</head>
<body>

<header>
  <h1>🍃 미세먼지 / 대기질 현황</h1>
  <p>에어코리아 API 기반 실시간 대기오염 정보</p>
</header>

<div class="container">
  <div class="info-box">
    ℹ️ 공공데이터포털(data.go.kr)의 <strong>에어코리아 대기오염정보 API</strong>를 활용한 실시간 대기질 조회 서비스입니다.<br>
    시/도를 선택하고 조회 버튼을 누르세요.
  </div>

  <div class="search-box">
    <select id="sidoSelect">
      <option value="">시/도 선택</option>
      <option value="서울">서울</option>
      <option value="부산">부산</option>
      <option value="대구">대구</option>
      <option value="인천">인천</option>
      <option value="광주">광주</option>
      <option value="대전">대전</option>
      <option value="울산">울산</option>
      <option value="경기">경기</option>
      <option value="강원">강원</option>
      <option value="충북">충북</option>
      <option value="충남">충남</option>
      <option value="전북">전북</option>
      <option value="전남">전남</option>
      <option value="경북">경북</option>
      <option value="경남">경남</option>
      <option value="제주">제주</option>
    </select>
    <button onclick="fetchData()" id="fetchBtn">🔍 조회</button>
  </div>

  <div id="resultArea"></div>
</div>

<footer>
  공공데이터 활용 수행평가 프로젝트 · 에어코리아 API
</footer>

<script>
  const API_KEY = "6d446e0921c341efbbddb27506aa2ca5563cf05db36ec5e3d4a95d85f5a2282d";

  const gradeInfo = {
    "1": { label: "좋음", cls: "grade-1" },
    "2": { label: "보통", cls: "grade-2" },
    "3": { label: "나쁨", cls: "grade-3" },
    "4": { label: "매우나쁨", cls: "grade-4" }
  };

  async function fetchData() {
    const sido = document.getElementById("sidoSelect").value;
    if (!sido) { alert("시/도를 선택하세요."); return; }

    const btn = document.getElementById("fetchBtn");
    btn.disabled = true;
    btn.textContent = "불러오는 중...";
    document.getElementById("resultArea").innerHTML = '<div class="loading">⏳ 데이터 불러오는 중...</div>';

    const url = `https://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getCtprvnRltmMesureDnsty?serviceKey=${encodeURIComponent(API_KEY)}&returnType=json&numOfRows=10&pageNo=1&sidoName=${encodeURIComponent(sido)}&ver=1.0`;

    try {
      const res = await fetch(url);
      const data = await res.json();
      const items = data?.response?.body?.items;

      if (!items || items.length === 0) {
        document.getElementById("resultArea").innerHTML = '<div class="empty">데이터가 없습니다.</div>';
        return;
      }
      render(items, sido);
    } catch (e) {
      document.getElementById("resultArea").innerHTML = `<div class="error">⚠️ 데이터 로드 실패: CORS 정책으로 인해 브라우저에서 직접 호출이 제한될 수 있습니다.<br>GitHub Pages로 배포 후 이용하거나 Python 코드를 사용하세요.</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = "🔍 조회";
    }
  }

  function avg(arr) {
    const nums = arr.map(Number).filter(v => !isNaN(v));
    return nums.length ? Math.round(nums.reduce((a,b)=>a+b,0)/nums.length) : '-';
  }

  function pmGrade(val, type) {
    if (val === '-') return '';
    const v = Number(val);
    if (type === 'pm10') {
      if (v <= 30) return '1'; if (v <= 80) return '2'; if (v <= 150) return '3'; return '4';
    } else {
      if (v <= 15) return '1'; if (v <= 35) return '2'; if (v <= 75) return '3'; return '4';
    }
  }

  function render(items, sido) {
    const pm10avg = avg(items.map(i => i.pm10Value));
    const pm25avg = avg(items.map(i => i.pm25Value));
    const o3avg = avg(items.map(i => i.o3Value));
    const no2avg = avg(items.map(i => i.no2Value));

    const g10 = gradeInfo[pmGrade(pm10avg, 'pm10')] || {};
    const g25 = gradeInfo[pmGrade(pm25avg, 'pm25')] || {};

    let html = `
      <div class="legend">
        <span class="grade-1">좋음 (0~30)</span>
        <span class="grade-2">보통 (31~80)</span>
        <span class="grade-3">나쁨 (81~150)</span>
        <span class="grade-4">매우나쁨 (151~)</span>
      </div>
      <div class="summary-grid">
        <div class="metric-card">
          <div class="metric-label">미세먼지 PM10</div>
          <div class="metric-value">${pm10avg}</div>
          <div class="metric-unit">㎍/㎥</div>
          ${g10.label ? `<span class="metric-grade ${g10.cls}">${g10.label}</span>` : ''}
        </div>
        <div class="metric-card">
          <div class="metric-label">초미세먼지 PM2.5</div>
          <div class="metric-value">${pm25avg}</div>
          <div class="metric-unit">㎍/㎥</div>
          ${g25.label ? `<span class="metric-grade ${g25.cls}">${g25.label}</span>` : ''}
        </div>
        <div class="metric-card">
          <div class="metric-label">오존 O₃</div>
          <div class="metric-value">${o3avg}</div>
          <div class="metric-unit">ppm</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">이산화질소 NO₂</div>
          <div class="metric-value">${no2avg}</div>
          <div class="metric-unit">ppm</div>
        </div>
      </div>
      <div class="section-title">${sido} 측정소별 현황 (${items.length}개소)</div>
      <div class="station-list">
    `;

    items.forEach(item => {
      const g = gradeInfo[item.pm10Grade] || { label: '-', cls: 'grade-2' };
      html += `
        <div class="station-card">
          <div class="station-header">
            <span class="station-name">📍 ${item.stationName}</span>
            <span class="metric-grade ${g.cls}">${g.label}</span>
          </div>
          <div class="pollutant-row">
            <div><div class="pollutant-name">PM10</div><div class="pollutant-val">${item.pm10Value ?? '-'}</div></div>
            <div><div class="pollutant-name">PM2.5</div><div class="pollutant-val">${item.pm25Value ?? '-'}</div></div>
            <div><div class="pollutant-name">O₃</div><div class="pollutant-val">${item.o3Value ?? '-'}</div></div>
            <div><div class="pollutant-name">NO₂</div><div class="pollutant-val">${item.no2Value ?? '-'}</div></div>
          </div>
        </div>
      `;
    });

    html += '</div>';
    document.getElementById("resultArea").innerHTML = html;
  }

  // 기본값으로 전북 자동 조회
  window.onload = () => {
    document.getElementById("sidoSelect").value = "전북";
    fetchData();
  };
</script>
</body>
</html>
